resources:
  jobs:
    enterprise_financial_pipeline_job:
      name: "Enterprise Financial Pipeline - Medallion Architecture"

      environments:
        - environment_key: "default_serverless_env"
          spec:
            environment_version: "1"

      tasks:
        - task_key: bronze_ingestion_task
          environment_key: "default_serverless_env"
          spark_python_task:
            python_file: "../src/bronze_ingestion.py"

        - task_key: silver_transformation_task
          depends_on:
            - task_key: bronze_ingestion_task
          environment_key: "default_serverless_env"
          spark_python_task:
            python_file: "../src/silver_transform.py"

        - task_key: gold_aggregation_task
          depends_on:
            - task_key: silver_transformation_task
          environment_key: "default_serverless_env"
          spark_python_task:
            python_file: "../src/gold_aggregation.py"

      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "UTC"